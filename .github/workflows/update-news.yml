name: Atualização Contínua de Notícias Factuais & Keep-Alive Supabase

on:
  schedule:
    # Executa a cada 12 horas (às 00:00 e 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite disparo manual direto no painel do GitHub

permissions:
  contents: write

jobs:
  scrape-and-sync:
    name: Web Scraping & Sincronização Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Pipeline de Scraping e Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_kEY: ${{ secrets.DATABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run scrape:news

      - name: Commit e Push dos Dados Locais (live-news.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/live-news.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): atualizar notícias factuais em tempo real [skip ci]"
            git push
          else
            echo "Nenhuma nova notícia detectada para comitar."
          fi
